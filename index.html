<script>
"use strict";
// =====================================================================
//  GRUNDSETUP
// =====================================================================
let W = 320, H = 180;
const T = 16, MW = 48, MH = 30, WW = MW * T, WH = MH * T;
const APP = /[?&]app=1/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const low = mk(W, H), g = low.getContext('2d');
const lm = mk(W, H), lmc = lm.getContext('2d');           // Lightmap (farbig)
const ground = mk(WW, WH), gg = ground.getContext('2d');
let scale = 4;
function resize() {                       // füllt immer den ganzen Bildschirm
  const dpr = window.devicePixelRatio || 1, vw = innerWidth, vh = innerHeight, asp = vw / vh;
  if (asp >= 16 / 9) { H = 180; W = Math.round(180 * asp); } else { W = 320; H = Math.round(320 / asp); }
  W = Math.min(W, 640); H = Math.min(H, 360);
  low.width = W; low.height = H; lm.width = W; lm.height = H;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  scale = cv.width / W; ctx.imageSmoothingEnabled = false;
}
function toggleFullscreen() {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { }
}
addEventListener('resize', resize); resize();
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// =====================================================================
//  SPRITES
// =====================================================================
function sprite(rows, pal) {
  const h = rows.length, w = rows[0].length, c = mk(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][i]; if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
  }
  return c;
}
function whiteOf(spr) {
  const c = mk(spr.width, spr.height), x = c.getContext('2d'); x.drawImage(spr, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); return c;
}
const MARINE = ["...kkkk...", "..kllllk..", ".kllaaaak.", ".kaaaVvvk.", ".kaaaVvVk.", "kkAaaaaaAk", "kllkAAkllk", "klAaaaaAlk", ".kAbbbbAk.", ".kaAaaAak."];
const HUMAN = ["...hhhh...", "..hhhhhh..", "..hsssshh.", "...sssse..", "...ssss...", "..pppppp..", ".spPppPps.", "..pppppp..", "..pppppp..", "..PPPPPP.."];
const ZOMBIE = ["...hhh....", "..hssss...", "..sssses..", "..sssss...", "...srs....", "..ggggssss", "..ggrgg...", "..gGgrg...", "..ggggg...", "..gGgGg..."];
const TANK = ["....hhhh....", "...hsssss...", "..sssssses..", "..sssssss...", ".sssrrssss..", "ssggggggssss", "sgggrggggss.", "sggggggrgg..", ".ggGggggGg..", ".gggggggg...", ".gGgGgGgg..."];
const LEGS = [[".kak...kak", ".kkk...kkk"], ["...kakak..", "...kkkkk.."], ["..kak.kak.", "..kkk.kkk."]];
const LEGS12 = [[".kaak...kaak", ".kkkk...kkkk"], ["...kaakaak..", "...kkkkkkk.."], ["..kaak.kaak.", "..kkkk.kkkk."]];
function makeSet(body, legs, pal, eye) {
  const fr = legs.map(l => { const s = sprite(body.concat(l), pal); return { n: s, w: whiteOf(s) }; });
  fr.eye = eye; return fr;
}
const SPR = { player: makeSet(MARINE, LEGS, { k: '#0c100e', l: '#7a9a66', a: '#4a6842', A: '#2f4430', V: '#1d7f9e', v: '#8ff4ff', b: '#5e4c30' }, null) };
const SURV_PALS = [
  { h: '#5a3a22', s: '#f0c49a', e: '#1a1a1a', p: '#e27aaa', P: '#b0507e', a: '#c05a8a', k: '#222' },   // Pflegerin
  { h: '#2a2a2a', s: '#e0b088', e: '#1a1a1a', p: '#e6ecee', P: '#aab4b8', a: '#3a4a6a', k: '#222' },   // Wissenschaftler
  { h: '#d9a441', s: '#f0c49a', e: '#1a1a1a', p: '#c04040', P: '#8a2a2a', a: '#3a5a8a', k: '#222' },   // Zivilist
];
const ZBASE = { h: '#3a4a2a', s: '#86a85e', e: '#ff2a2a', r: '#7a1010', a: '#6f8f50', k: '#222' };
const ZPALS = [
  { walker: ['#9fb6c4', '#7a90a0'], runner: ['#d8dcd6', '#a8aca6'], tank: ['#5a6a78', '#3e4a56'] },
  { walker: ['#c8b040', '#9a8628'], runner: ['#e8eef0', '#b8c2c6'], tank: ['#3a3f44', '#25292d'] },
  { walker: ['#6a5040', '#4a382c'], runner: ['#a03030', '#6a2020'], tank: ['#2e3a5a', '#1e2840'] },
];
function makeLevelSprites(i) {
  SPR.surv = makeSet(HUMAN, LEGS, SURV_PALS[i], null);
  const z = ZPALS[i];
  SPR.walker = makeSet(ZOMBIE, LEGS, { ...ZBASE, g: z.walker[0], G: z.walker[1] }, [6, 2]);
  SPR.runner = makeSet(ZOMBIE, LEGS, { ...ZBASE, h: '#2a2a22', s: '#a8c070', e: '#ffd030', a: '#3a3a44', g: z.runner[0], G: z.runner[1] }, [6, 2]);
  SPR.tank = makeSet(TANK, LEGS12, { ...ZBASE, h: '#1e2618', s: '#6f8a4a', a: '#5a7440', k: '#111', g: z.tank[0], G: z.tank[1] }, [9, 2]);
}
const HEART = [".rr.rr.", "rrrrrrr", "rrrrrrr", ".rrrrr.", "..rrr..", "...r..."];
const heartFull = sprite(HEART, { r: '#d83a4a' }), heartEmpty = sprite(HEART, { r: '#3a2a2e' });
const AMMO = sprite(["kkkkkkk", "koyyyok", "kooooook".slice(0, 7), "kkkkkkk"], { k: '#1a1a12', o: '#5a6a34', y: '#e0c040' });
const MED = sprite([".kkkkk.", "kwwrwwk", "kwrrrwk", "kwwrwwk", ".kkkkk."], { k: '#333', w: '#e8ecec', r: '#d02a2a' });

// =====================================================================
//  AUDIO – realistischere Sounds (Schichten + Raumhall + Kompressor)
// =====================================================================
let ac = null, master, verb, noiseBuf, ambientOn = false;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 8; comp.attack.value = .002; comp.release.value = .18;
    master = ac.createGain(); master.gain.value = .85; master.connect(comp); comp.connect(ac.destination);
    verb = ac.createConvolver(); verb.buffer = makeIR(1.8, 2.6);
    const vg = ac.createGain(); vg.gain.value = .5; verb.connect(vg); vg.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function makeIR(dur, decay) {
  const len = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / len, early = i < ac.sampleRate * .06 && Math.random() < .004 ? 3 : 1;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * early;
    }
  }
  return b;
}
function route(node, wet, pan) {
  let n = node;
  if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); n.connect(p); n = p; }
  n.connect(master);
  if (wet > 0) { const s = ac.createGain(); s.gain.value = wet; n.connect(s); s.connect(verb); }
}
function nz(o) {
  if (!ac) return;
  const t = ac.currentTime + (o.delay || 0), src = ac.createBufferSource(); src.buffer = noiseBuf;
  src.playbackRate.value = o.rate || 1;
  const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || .8;
  if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t + o.dur);
  const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, t);
  gn.gain.linearRampToValueAtTime(o.vol, t + (o.att || .001)); gn.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(gn); route(gn, o.wet ?? .3, o.pan);
  src.start(t, Math.random() * 1.5); src.stop(t + o.dur + .05);
}
function os(o) {
  if (!ac) return;
  const t = ac.currentTime + (o.delay || 0), x = ac.createOscillator(); x.type = o.type || 'sine';
  x.frequency.setValueAtTime(o.f, t); if (o.fEnd) x.frequency.exponentialRampToValueAtTime(o.fEnd, t + o.dur);
  let last = x;
  if (o.filter) { const f = ac.createBiquadFilter(); f.type = o.filter; f.frequency.value = o.ff || 800; f.Q.value = o.q || 1; x.connect(f); last = f; }
  const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, t);
  gn.gain.linearRampToValueAtTime(o.vol, t + (o.att || .002)); gn.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  last.connect(gn); route(gn, o.wet ?? .2, o.pan);
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibD || 6; l.connect(lg); lg.connect(x.frequency); l.start(t); l.stop(t + o.dur + .05); }
  if (o.trem) { const l = ac.createOscillator(), lg = ac.createGain(); l.type = 'square'; l.frequency.value = o.trem; lg.gain.value = o.vol * .6; l.connect(lg); lg.connect(gn.gain); l.start(t); l.stop(t + o.dur + .05); }
  x.start(t); x.stop(t + o.dur + .05);
}
function startAmbient() {
  if (!ac || ambientOn) return; ambientOn = true;
  [[50, .022], [100, .012], [150, .004]].forEach(([f, v]) => {        // Neonröhren-Brummen
    const x = ac.createOscillator(), gn = ac.createGain(); x.frequency.value = f; gn.gain.value = v; x.connect(gn); gn.connect(master); x.start();
  });
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;          // Lüftung
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
  const gn = ac.createGain(); gn.gain.value = .05; s.connect(f); f.connect(gn); gn.connect(master); s.start();
}
const sfx = {
  shot(w) {                                  // Schuss: Knall + Körper + Druckwelle + Hall (je Waffe anders)
    const S = (w && w.snd) || { body: 1, low: 1, len: 1, tail: 1 };
    nz({ dur: .025, vol: 1, type: 'highpass', freq: 2200 * S.body, wet: .15 });
    nz({ dur: .16 * S.len, vol: .95, type: 'lowpass', freq: rnd(3200, 4200) * S.body, freqEnd: 350 * S.low, wet: .5 });
    os({ type: 'sine', f: rnd(140, 165) * S.low, fEnd: 38, dur: .16 * S.len, vol: 1, wet: .25 });
    nz({ dur: .7 * S.tail, vol: .09 * S.tail, type: 'bandpass', freq: 700 * S.low, q: .6, delay: .015, wet: 1 });
    const d = rnd(.32, .5);                   // Hülse klimpert
    os({ f: rnd(4800, 5600), dur: .035, vol: .035, delay: d, wet: .1 });
    os({ f: rnd(5800, 6600), dur: .03, vol: .025, delay: d + rnd(.05, .09), wet: .1 });
  },
  impact() { nz({ dur: .03, vol: .25, type: 'highpass', freq: 3000, wet: .3 }); if (Math.random() < .25) os({ type: 'sine', f: rnd(2600, 3200), fEnd: rnd(1100, 1500), dur: .22, vol: .035, wet: .5 }); },
  flesh() { nz({ dur: .09, vol: .55, type: 'lowpass', freq: 420, wet: .1 }); nz({ dur: .07, vol: .2, type: 'bandpass', freq: 900, q: 3, delay: .01, wet: .1 }); },
  zDie(pan) { os({ type: 'sawtooth', f: rnd(110, 130), fEnd: 45, dur: .55, vol: .16, filter: 'bandpass', ff: 550, q: 3, trem: 22, pan, wet: .4 }); nz({ dur: .18, vol: .6, type: 'lowpass', freq: 220, delay: .3, pan, wet: .3 }); },
  growl(v, pan, big) {
    const dur = rnd(.6, 1.2);
    os({ type: 'sawtooth', f: big ? rnd(45, 60) : rnd(70, 100), fEnd: big ? 38 : rnd(55, 70), dur, vol: .14 * v, att: .12, filter: 'bandpass', ff: big ? 380 : rnd(480, 700), q: 4, vib: rnd(4, 7), vibD: 8, trem: rnd(18, 30), pan, wet: .55 });
    nz({ dur: dur * .8, vol: .05 * v, type: 'bandpass', freq: 1200, q: 1, att: .1, pan, wet: .5 });
  },
  step() { nz({ dur: .05, vol: .12, type: 'lowpass', freq: rnd(420, 700), wet: .12 }); nz({ dur: .012, vol: .03, type: 'highpass', freq: 3500, wet: .05 }); },
  zstep(v, pan) { nz({ dur: .07, vol: .06 * v, type: 'lowpass', freq: 300, pan, wet: .3 }); },
  reload() {
    nz({ dur: .015, vol: .35, type: 'highpass', freq: 4000, wet: .2 });                         // Magazinknopf
    nz({ dur: .09, vol: .12, type: 'bandpass', freq: 1500, q: 2, delay: .05, wet: .2 });        // Magazin raus
    nz({ dur: .045, vol: .45, type: 'lowpass', freq: 1300, delay: .75, wet: .2 });              // Magazin rein
    nz({ dur: .012, vol: .3, type: 'highpass', freq: 4500, delay: .77, wet: .2 });
    nz({ dur: .03, vol: .4, type: 'bandpass', freq: 2600, q: 2, delay: 1.2, wet: .2 });         // Verschluss
    nz({ dur: .1, vol: .15, type: 'bandpass', freq: 1800, q: 1.5, delay: 1.24, wet: .2 });
    nz({ dur: .015, vol: .45, type: 'highpass', freq: 3800, delay: 1.36, wet: .25 });
  },
  coin() { os({ type: 'triangle', f: 1320, dur: .06, vol: .05, wet: .1 }); os({ type: 'triangle', f: 1760, dur: .09, vol: .05, delay: .06, wet: .1 }); },
  buy() { [660, 880, 1100, 1320].forEach((f, i) => os({ type: 'triangle', f, dur: .1, vol: .06, delay: i * .06, wet: .2 })); },
  nope() { os({ type: 'square', f: 180, fEnd: 120, dur: .18, vol: .05, wet: .1 }); },
  dry() { nz({ dur: .012, vol: .35, type: 'highpass', freq: 5000, wet: .2 }); os({ type: 'square', f: 2200, dur: .012, vol: .03 }); },
  melee() { nz({ dur: .14, vol: .3, type: 'bandpass', freq: 1400, freqEnd: 350, q: 1.2, wet: .15 }); },
  hurt() { os({ type: 'sawtooth', f: 150, fEnd: 85, dur: .22, vol: .35, filter: 'lowpass', ff: 700, wet: .2 }); nz({ dur: .12, vol: .4, type: 'lowpass', freq: 500, wet: .1 }); },
  survHurt(pan) { os({ type: 'sawtooth', f: rnd(620, 700), fEnd: 420, dur: .35, vol: .1, filter: 'bandpass', ff: 1500, q: 2, vib: 9, vibD: 25, pan, wet: .5 }); },
  rescue() { nz({ dur: .06, vol: .12, type: 'bandpass', freq: 2200, q: 2, wet: 0 }); os({ type: 'square', f: 1200, dur: .07, vol: .04, delay: .07, filter: 'bandpass', ff: 1500, wet: 0 }); os({ type: 'square', f: 1600, dur: .1, vol: .04, delay: .16, filter: 'bandpass', ff: 1800, wet: 0 }); nz({ dur: .3, vol: .05, type: 'bandpass', freq: 2500, q: 1, delay: .28, wet: 0 }); },
  pickAmmo() { os({ type: 'triangle', f: 2400, dur: .05, vol: .08, wet: .2 }); nz({ dur: .04, vol: .3, type: 'bandpass', freq: 1200, q: 2, delay: .03, wet: .2 }); },
  pickMed() { nz({ dur: .18, vol: .15, type: 'bandpass', freq: 3200, q: 2, wet: .2 }); os({ f: 880, dur: .12, vol: .05, delay: .15, wet: .2 }); },
  joined() { os({ type: 'triangle', f: 520, fEnd: 700, dur: .15, vol: .06, wet: .3 }); },
  heart() { os({ f: 58, fEnd: 38, dur: .12, vol: .6, wet: 0 }); os({ f: 52, fEnd: 36, dur: .12, vol: .45, delay: .18, wet: 0 }); },
  siren() { for (let i = 0; i < 4; i++) os({ type: 'square', f: i % 2 ? 660 : 880, dur: .35, vol: .025, delay: i * .38, filter: 'bandpass', ff: 900, q: 2, wet: .9 }); },
  lost() { os({ type: 'sawtooth', f: 120, fEnd: 50, dur: 1.2, vol: .2, filter: 'lowpass', ff: 600, wet: .7 }); nz({ dur: 1, vol: .1, type: 'lowpass', freq: 300, wet: .7 }); },
  flick() { nz({ dur: .02, vol: .25, type: 'highpass', freq: 3000, wet: .1 }); },
  ui() { os({ type: 'square', f: 900, dur: .04, vol: .03, wet: .1 }); },
};

// =====================================================================
//  EINGABE
// =====================================================================
const keys = new Set();
const mouse = { x: W / 2, y: H / 2, down: false, right: false };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === 'v') toggleFullscreen();
  if (state === 'device') { if (k === '1' || k === 'enter') chooseDevice(false); if (k === '2') chooseDevice(true); return; }
  if (state === 'shop') { if (k === 'escape' || k === 'backspace') { state = 'menu'; sfx.ui(); } if (k === 'arrowleft' || k === 'arrowright') shopTab = 1 - shopTab; return; }
  if (state === 'menu') {
    if (k >= '1' && k <= '3') selectLevel(+k - 1);
    if (k === 'arrowleft') { selDiff = Math.max(0, selDiff - 1); sfx.ui(); }
    if (k === 'arrowright') { selDiff = Math.min(3, selDiff + 1); sfx.ui(); }
    if (k === 'enter') { initAudio(); newGame(); }
  } else {
    if (k === 'r') tryReload();
    if (k === 'f' && inPlay()) { player.lamp = !player.lamp; sfx.flick(); }
    if ((k === 'p' || k === 'escape') && inPlay()) paused = !paused;
    if (k === 'm' && (paused || state === 'over')) toMenu();
  }
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); mouse.down = mouse.right = false; });
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H;
});
cv.addEventListener('mousedown', e => {
  e.preventDefault(); initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  if (tapUI()) return;
  if (e.button === 2) mouse.right = true; else mouse.down = true;
});
// Klick/Tipp auf Bildschirme ausserhalb des Spiels (Geräteauswahl, Menü, Pause, Game Over)
function tapUI() {
  if (state === 'device' || state === 'menu' || state === 'shop') { menuClick(); return true; }
  if (paused) { menuClick(); return true; }
  if (state === 'over') { if (overT > 1 && !menuClick()) newGame(); return true; }
  return false;
}
// ---------- Touch-Steuerung (Handy / Tablet) ----------
const MOVE_R = 22, AIM_R = 30;              // Stick-Grössen (rechter Stick grösser)
const touch = { mobile: false, move: { id: null }, aim: { id: null }, aimAngle: -Math.PI / 2, meleeTap: false };
let mobileButtons = [];
const tpos = t => { const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H }; };
cv.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  for (const t of e.changedTouches) {
    const q = tpos(t);
    if (!inPlay() || paused) { mouse.x = q.x; mouse.y = q.y; tapUI(); continue; }
    if (!touch.mobile) continue;
    const b = mobileButtons.find(b => Math.hypot(q.x - b.x, q.y - b.y) < b.r + 4);
    if (b) { b.act(); b.flash = .15; continue; }
    if (q.x < W / 2 && touch.move.id === null) touch.move = { id: t.identifier, ox: q.x, oy: q.y, dx: 0, dy: 0 };
    else if (q.x >= W / 2 && touch.aim.id === null) touch.aim = { id: t.identifier, ox: q.x, oy: q.y, dx: 0, dy: 0, mag: 0 };
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const q = tpos(t);
    for (const st of [touch.move, touch.aim]) {
      if (st.id !== t.identifier) continue;
      const SR = st === touch.aim ? AIM_R : MOVE_R;
      let dx = (q.x - st.ox) / SR, dy = (q.y - st.oy) / SR; const l = Math.hypot(dx, dy);
      if (l > 1) { st.ox = q.x - dx / l * SR; st.oy = q.y - dy / l * SR; dx /= l; dy /= l; }   // Stick zieht mit
      st.dx = dx; st.dy = dy; st.mag = Math.min(1, l);
      if (st === touch.aim && st.mag > .15) touch.aimAngle = Math.atan2(dy, dx);
    }
  }

// Trifft der Strahl eine Wand von unten, läuft er auf der sichtbaren Wandfront (unterste 8 px) weiter
// bis zu deren Oberkante – so wird die Front sauber und ohne Keile beleuchtet.
const WALL_FACE = 8;

    if (tmx < tmy) { t = tmx; tmx += tdx; tx += sx; side = 0; } else { t = tmy; tmy += tdy; ty += sy; side = 1; }
    if (t >= max) break;

function pushOut(e, r) {
  const x0 = Math.floor((e.x - r) / T), x1 = Math.floor((e.x + r) / T), y0 = Math.floor((e.y - r) / T), y1 = Math.floor((e.y + r) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!solidT(tx, ty)) continue;
    const wx = tx * T, wy = ty * T, nx = clamp(e.x, wx, wx + T), ny = clamp(e.y, wy, wy + T);
    const dx = e.x - nx, dy = e.y - ny, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 === 0) {
        const l = e.x - wx, rr = wx + T - e.x, t = e.y - wy, b = wy + T - e.y, m = Math.min(l, rr, t, b);
        if (m === l) e.x = wx - r; else if (m === rr) e.x = wx + T + r; else if (m === t) e.y = wy - r; else e.y = wy + T + r;
      } else { const d = Math.sqrt(d2); e.x = nx + dx / d * r; e.y = ny + dy / d * r; }
    }
  }
  e.x = clamp(e.x, r, WW - r); e.y = clamp(e.y, r, WH - r);
}
const flow = new Int16Array(MW * MH);
function computeFlow(srcs) {
  flow.fill(-1); const q = [];
  for (const s of srcs) {
    const tx = Math.floor(s.x / T), ty = Math.floor(s.y / T);
    if (!solidT(tx, ty) && flow[ty * MW + tx] < 0) { flow[ty * MW + tx] = 0; q.push(ty * MW + tx); }
  }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % MW, y = (i / MW) | 0, d = flow[i] + 1;
    if (x > 0 && !solidT(x - 1, y) && flow[i - 1] < 0) { flow[i - 1] = d; q.push(i - 1); }
    if (x < MW - 1 && !solidT(x + 1, y) && flow[i + 1] < 0) { flow[i + 1] = d; q.push(i + 1); }
    if (y > 0 && !solidT(x, y - 1) && flow[i - MW] < 0) { flow[i - MW] = d; q.push(i - MW); }
    if (y < MH - 1 && !solidT(x, y + 1) && flow[i + MW] < 0) { flow[i + MW] = d; q.push(i + MW); }
  }
}
function randomFloor(cond, tries = 300) {
  for (let t = 0; t < tries; t++) {
    const tx = ri(1, MW - 2), ty = ri(1, MH - 2);
    if (solidT(tx, ty) || !reach[ty * MW + tx]) continue;
    const x = tx * T + 8, y = ty * T + 8;
    if (cond(x, y, tx, ty)) return { x, y };
  }
  return null;
}

    const x = ox + 30 + i * 136, y = oy + 64, w = 124, h = 70;
    const hv = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
    box(x, y, w, h, hv ? 'rgba(40,55,48,.92)' : 'rgba(14,16,18,.88)', i === rec ? '#6dff8a' : hv ? '#aaa' : '#555', i === rec ? 1.5 : 1);
    // kleines Symbol
    ctx.strokeStyle = '#cfd8d6'; ctx.lineWidth = Math.max(1, scale * .8);
    if (i === 0) { ctx.strokeRect((x + 46) * scale, (y + 8) * scale, 32 * scale, 20 * scale); ctx.strokeRect((x + 40) * scale, (y + 30) * scale, 44 * scale, 4 * scale); }
    else { ctx.strokeRect((x + 44) * scale, (y + 10) * scale, 36 * scale, 20 * scale); circle(x + 50, y + 20, 2.5, null, '#cfd8d6'); circle(x + 74, y + 20, 2.5, null, '#cfd8d6'); }
    txt(t, x + w / 2, y + 40, 6, '#fff', 'center');
    txt(d, x + w / 2, y + 50, 4.2, '#aaa', 'center');
    txt(i === rec ? 'EMPFOHLEN' : (touch.mobile ? '' : k), x + w / 2, y + 59, 3.6, i === rec ? '#6dff8a' : '#777', 'center');
    buttons.push({ x, y, w, h, act: () => chooseDevice(i === 1) });
  });
  txt('Du kannst das später im Hauptmenü ändern.', W / 2, oy + 146, 4, '#888', 'center');
  renderRotateHint();
}

// ---------- Shop ----------
function coinIcon(x, y, r) { circle(x, y, r, '#ffcf3a', '#a07810'); txt('Z', x, y - r * .6, r * 1.3, '#7a5a10', 'center'); }
function renderShop() {
  const ox = Math.round((W - 320) / 2), oy = Math.round((H - 180) / 2);
  const hover = (x, y, w, h) => !touch.mobile && mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, cv.width, cv.height);
  txt('SHOP', W / 2, oy + 4, 14, '#ffcf3a', 'center');
  uiButton(ox + 8, oy + 6, 56, 13, '< ZURÜCK', () => { sfx.ui(); state = 'menu'; });
  box(ox + 248, oy + 6, 64, 13, 'rgba(40,30,6,.9)', '#ffcf3a', 1.2);
  coinIcon(ox + 257, oy + 12.5, 3.6); txt(save.zc + ' ZC', ox + 286, oy + 9.5, 4.8, '#ffcf3a', 'center');
  ['WAFFEN', 'SKINS'].forEach((t, i) => {
    const x = ox + 90 + i * 74, y = oy + 26, sel = i === shopTab;
    box(x, y, 68, 12, sel ? 'rgba(60,46,10,.95)' : hover(x, y, 68, 12) ? 'rgba(30,30,30,.9)' : 'rgba(12,12,12,.85)', sel ? '#ffcf3a' : '#555', sel ? 1.5 : 1);
    txt(t, x + 34, y + 3, 5, sel ? '#ffcf3a' : '#aaa', 'center');
    buttons.push({ x, y, w: 68, h: 12, act: () => { shopTab = i; sfx.ui(); } });
  });
  const items = shopTab === 0 ? WEAPONS : SKINS, kind = shopTab === 0 ? 'w' : 's';
  const owned = kind === 'w' ? save.weapons : save.skins, equipped = kind === 'w' ? save.weapon : save.skin;
  items.forEach((it, i) => {
    const col = i % 3, row = Math.floor(i / 3), x = ox + 10 + col * 102, y = oy + 44 + row * 63, w = 96, h = 58;
    const own = owned.includes(it.id), eq = equipped === it.id, afford = save.zc >= it.price, hv = hover(x, y, w, h);
    box(x, y, w, h, eq ? 'rgba(30,60,40,.92)' : hv ? 'rgba(36,34,28,.95)' : 'rgba(14,14,14,.9)', eq ? '#6dff8a' : own ? '#888' : afford ? '#ffcf3a' : '#444', eq ? 1.5 : 1);
    txt(it.name, x + w / 2, y + 3, 4.6, '#fff', 'center');
    if (kind === 'w') {
      txt(it.desc, x + w / 2, y + 11, 3.2, '#aaa', 'center');
      ['SCHADEN', 'TEMPO', 'MAGAZIN'].forEach((lab, k) => {
        const yy = y + 19 + k * 7;
        txt(lab, x + 6, yy, 3.2, '#999');
        for (let b = 0; b < 5; b++) { ctx.fillStyle = b < it.stats[k] ? '#ffcf3a' : '#333'; ctx.fillRect((x + 46 + b * 9) * scale, (yy + .5) * scale, 7 * scale, 3 * scale); }
      });
    } else {
      const img = SKIN_SPR[it.id], sz = 2.6;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, (x + w / 2 - img.width * sz / 2) * scale, (y + 11) * scale, img.width * sz * scale, img.height * sz * scale);
    }
    const label = eq ? 'AUSGERÜSTET' : own ? 'AUSRÜSTEN' : it.price + ' ZC';
    box(x + 14, y + h - 13, w - 28, 10, eq ? 'rgba(40,90,55,.9)' : own ? 'rgba(40,40,40,.9)' : afford ? 'rgba(90,66,10,.95)' : 'rgba(40,20,20,.9)', null);
    txt(label, x + w / 2, y + h - 11, 4.2, eq ? '#6dff8a' : own ? '#ddd' : afford ? '#ffcf3a' : '#ff7070', 'center');
    buttons.push({ x, y, w, h, act: () => shopAction(it, kind) });
  });
  if (shopMsg && shopMsg.t > 0) { shopMsg.t -= 1 / 60; ctx.globalAlpha = Math.min(1, shopMsg.t * 2); txt(shopMsg.text, W / 2, oy + 172, 4.6, shopMsg.col, 'center'); ctx.globalAlpha = 1; }
  else txt('ZC verdienen: Zombie-Kill +10 · Rettung +50 · überlebte Welle +100', W / 2, oy + 172, 3.8, '#999', 'center');
}

// ---------- Hauptmenü ----------
function renderMenu() {
  buttons = [];
  const ox = Math.round((W - 320) / 2), oy = Math.round((H - 180) / 2);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, cv.width, cv.height);
  txt('LAST LIGHT', W / 2, oy + 6, 19, '#d83a4a', 'center');
  {
    const bx = ox + 248, by = oy + 4, bw = 64, bh = 20, hv = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;
    const gl = .5 + .5 * Math.sin(performance.now() / 300);
    box(bx, by, bw, bh, hv ? 'rgba(70,52,10,.95)' : 'rgba(40,30,6,.9)', `rgba(255,207,58,${.6 + .4 * gl})`, 1.5);
    txt('SHOP', bx + bw / 2, by + 3, 6, '#ffcf3a', 'center');
    txt(save.zc + ' ZC', bx + bw / 2, by + 12, 4, '#fff', 'center');
    buttons.push({ x: bx, y: by, w: bw, h: bh, act: () => { sfx.ui(); shopMsg = null; state = 'shop'; } });
  }
  txt('Du bist der letzte Marine. Hol die Überlebenden raus.', W / 2, oy + 28, 4.2, '#ddd', 'center');
  txt('EINSATZORT', ox + 10, oy + 37, 4.2, '#9fb6c4');
  const hover = (x, y, w, h) => mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  LEVELS.forEach((L, i) => {
    const x = ox + 10 + i * 102, y = oy + 44, w = 96, h = 50, sel = i === selLevel, hv = hover(x, y, w, h);
    box(x, y, w, h, sel ? 'rgba(40,60,50,.85)' : hv ? 'rgba(30,36,40,.85)' : 'rgba(12,14,16,.8)', sel ? '#6dff8a' : hv ? '#888' : '#333', sel ? 1.5 : 1);
    txt((i + 1) + ' ' + L.short, x + w / 2, y + 4, 5, sel ? '#fff' : '#bbb', 'center');
    txt(L.name, x + w / 2, y + 12, 3.4, '#9fb6c4', 'center');
    txt(L.desc[0], x + w / 2, y + 21, 3.4, '#ccc', 'center');
    txt(L.desc[1], x + w / 2, y + 27, 3.4, '#ccc', 'center');
    const b = getBest(i, selDiff);
    txt(b ? 'Rekord: ' + b : '—', x + w / 2, y + 39, 3.4, '#ffd34d', 'center');
    buttons.push({ x, y, w, h, act: () => selectLevel(i) });
  });
  txt('SCHWIERIGKEIT', ox + 10, oy + 99, 4.2, '#9fb6c4');
  DIFFS.forEach((D, i) => {
    const x = ox + 10 + i * 76, y = oy + 106, w = 72, h = 14, sel = i === selDiff, hv = hover(x, y, w, h);
    box(x, y, w, h, sel ? 'rgba(50,30,20,.85)' : hv ? 'rgba(30,30,30,.85)' : 'rgba(12,12,12,.8)', sel ? D.col : hv ? '#888' : '#333', sel ? 1.5 : 1);
    txt(D.name, x + w / 2, y + 4, 4.8, sel ? D.col : '#aaa', 'center');
    buttons.push({ x, y, w, h, act: () => { selDiff = i; sfx.ui(); } });
  });
  txt(DIFFS[selDiff].desc, W / 2, oy + 124, 3.8, DIFFS[selDiff].col, 'center');
  txt('Waffe: ' + curWeapon().name + ' · Skin: ' + (SKINS.find(k => k.id === save.skin) || SKINS[0]).name, ox + 312, oy + 99, 3.4, '#ffcf3a', 'right');
  const sx = W / 2 - 60, sy = oy + 134, hv = hover(sx, sy, 120, 17);
  const blink = .6 + .4 * Math.sin(performance.now() / 250);
  box(sx, sy, 120, 17, hv ? 'rgba(120,20,20,.95)' : `rgba(90,15,15,${.7 + .2 * blink})`, '#d83a4a', 1.5);
  txt('EINSATZ STARTEN', W / 2, sy + 5, 6, '#fff', 'center');
  buttons.push({ x: sx, y: sy, w: 120, h: 17, act: () => newGame() });
  // kleine Knöpfe: Vollbild / Beenden
  const fx = ox + 10, fy = oy + 137, fh = 11, fsel = !!document.fullscreenElement;
  box(fx, fy, 70, fh, hover(fx, fy, 70, fh) ? 'rgba(30,30,30,.9)' : 'rgba(12,12,12,.8)', '#555');
  txt(fsel ? 'FENSTER (V)' : 'VOLLBILD (V)', fx + 35, fy + 3.5, 3.8, '#ccc', 'center');
  buttons.push({ x: fx, y: fy, w: 70, h: fh, act: () => { sfx.ui(); toggleFullscreen(); } });
  const dx2 = ox + 10, dy2 = fy + 13;
  box(dx2, dy2, 70, fh, hover(dx2, dy2, 70, fh) ? 'rgba(30,30,30,.9)' : 'rgba(12,12,12,.8)', '#555');
  txt(touch.mobile ? 'STEUERUNG: HANDY' : 'STEUERUNG: PC', dx2 + 35, dy2 + 3.5, 3.6, '#ccc', 'center');
  buttons.push({ x: dx2, y: dy2, w: 70, h: fh, act: () => { sfx.ui(); state = 'device'; } });
  if (APP) {
    const qx = ox + 240, qy = fy;
    box(qx, qy, 70, fh, hover(qx, qy, 70, fh) ? 'rgba(60,20,20,.9)' : 'rgba(12,12,12,.8)', '#555');
    txt('BEENDEN', qx + 35, qy + 3.5, 3.8, '#ccc', 'center');
    buttons.push({ x: qx, y: qy, w: 70, h: fh, act: () => { try { window.close(); } catch (e) { } } });
  }
  if (touch.mobile) {
    txt('Linker Daumen: bewegen · Rechter Daumen: zielen (bis zum Rand = Feuer)', W / 2 + 40, oy + 160, 3.4, '#999', 'center');
    txt('Knöpfe: SCHLAG · R nachladen · LICHT · II Pause', W / 2 + 40, oy + 167, 3.4, '#999', 'center');
  } else {
    txt('WASD bewegen · Maus zielen · Linksklick schiessen · Rechtsklick Kolbenschlag', W / 2 + 40, oy + 160, 3.4, '#999', 'center');
    txt('R nachladen · F Taschenlampe · P Pause · V Vollbild · Schüsse locken Zombies an!', W / 2 + 40, oy + 167, 3.4, '#999', 'center');
  }
}
function menuClick() { for (const b of buttons) if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) { b.act(); return true; } return false; }

// =====================================================================
//  GAME LOOP
// =====================================================================
let last = 0;
loadLevel(0);
function loop(t) {
  const dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
  if (inPlay() && !paused) update(dt);
  else if (state === 'over') { overT += dt; time += dt; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
